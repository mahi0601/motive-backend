<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Motive">
  <defs>
    <linearGradient id="motiveGrad" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CF6"/>
      <stop offset="0.55" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#C45BD6"/>
    </linearGradient>
    <linearGradient id="motiveShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="motiveTile">
      <rect x="8" y="8" width="112" height="112" rx="33"/>
    </clipPath>
    <style>
      .motive-mark {
        animation: motive-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        transform-box: fill-box;
      }
      .motive-check {
        stroke-dasharray: 100;
        animation: motive-draw 3.2s cubic-bezier(0.65, 0, 0.35, 1) 0.9s infinite;
      }
      .motive-spark {
        transform-origin: 100px 35px;
        animation: motive-pop 3.2s ease-in-out 0.9s infinite;
      }
      .motive-ping {
        transform-origin: 100px 35px;
        animation: motive-ping 3.2s ease-out 0.9s infinite;
      }
      .motive-shine {
        animation: motive-sweep 4s ease-in-out 1.4s infinite;
      }
      @keyframes motive-in {
        from { opacity: 0; transform: translateY(8px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes motive-draw {
        0%, 8% { stroke-dashoffset: 100; }
        35%, 70% { stroke-dashoffset: 0; }
        88%, 100% { stroke-dashoffset: -100; }
      }
      @keyframes motive-pop {
        0%, 8% { opacity: 0; transform: scale(0.3); }
        38% { opacity: 1; transform: scale(1.2); }
        46%, 70% { opacity: 1; transform: scale(1); }
        88%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes motive-ping {
        0%, 33% { opacity: 0; transform: scale(1); }
        40% { opacity: 0.8; transform: scale(1); }
        62%, 100% { opacity: 0; transform: scale(2.4); }
      }
      @keyframes motive-sweep {
        0%, 100% { transform: translateX(-140px) rotate(20deg); }
        50% { transform: translateX(140px) rotate(20deg); }
      }
    </style>
  </defs>
  <g class="motive-mark">
    <rect x="8" y="8" width="112" height="112" rx="33" fill="url(#motiveGrad)"/>
    <g clip-path="url(#motiveTile)">
      <rect class="motive-shine" x="-20" y="-40" width="30" height="200" fill="url(#motiveShine)"/>
    </g>
    <circle class="motive-ping" cx="100" cy="35" r="7.5" fill="none" stroke="#FFC04D" stroke-width="2.5"/>
    <path class="motive-check" d="M36 66.6 L56.4 86.8 L92 43.6" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle class="motive-spark" cx="100" cy="35" r="7.5" fill="#FFC04D"/>
  </g>
</svg>
