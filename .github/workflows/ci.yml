name: CI

on:
  push:
    branches: [master]
  pull_request: # any base branch, so stacked PRs are checked too

# A newer push to the same ref supersedes an in-flight run — but never cancel
# a run on master, so a deploy that's already started isn't cut off mid-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # Scans only the commits introduced by this push/PR (gitleaks-action
  # computes that range itself per event type) — not the repo's full
  # history. A real credential (a MongoDB Atlas connection string + JWT secret) was
  # committed and later deleted in this repo's history before this job
  # existed; a full-history scan would flag that forever even after
  # rotation. Scanning only what's new is what actually prevents a repeat,
  # without permanently red-X'ing CI over an already-handled leak.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks-action needs real history to diff the push/PR range against
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  build:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the lifetime of this job only — not the dev
    # database, no Neon/account access needed. Gives `prisma migrate deploy`
    # and `npm test` a real database to run against instead of just parsing
    # the schema. (A Neon branch was considered and rejected: it would need
    # dashboard access that CI doesn't have.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # A dummy value satisfying config/env.js's boot-time length check —
      # never a real credential, this container and everything in it stop
      # existing the moment the job ends.
      JWT_SECRET: ci-only-dummy-secret-0000000000000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Non-blocking, deliberately: after `npm audit fix` the only advisories
      # left are 3 high ones in the Prisma CLI chain (prisma → @prisma/config →
      # deepmerge-ts). They are accepted: the package only loads the CLI's own
      # config file at build/migrate time and is not reachable from request
      # handling, and a Prisma major upgrade does not clear it (every
      # @prisma/config release still depends on the affected deepmerge-ts).
      # Re-check when Prisma ships a config package on deepmerge-ts 8.x, then
      # make this blocking again so new high/critical advisories fail the build.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx prisma validate
      - run: npx prisma generate
      # Applies every committed migration to the fresh container above —
      # this is what actually proves the migrations themselves are correct,
      # not just that schema.prisma parses.
      - run: npx prisma migrate deploy
      - run: npm test

  # Builds the production image and checks the properties that matter, because a
  # Dockerfile that merely builds can still run as root or ship test tooling. Boots
  # the image against a throwaway database as well.
  docker-image:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the boot check below only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t clientglass-api:ci .
      - name: Runs as an unprivileged user
        run: |
          uid=$(docker run --rm --entrypoint id clientglass-api:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Contains production dependencies only, plus the Prisma CLI
        run: |
          docker run --rm --entrypoint sh clientglass-api:ci -c 'test -x node_modules/.bin/prisma && test ! -d node_modules/jest && test ! -d node_modules/supertest'
      - name: Uploads directory is writable by that user
        run: docker run --rm --entrypoint sh clientglass-api:ci -c 'touch public/uploads/.w && rm public/uploads/.w'
      - name: Declares a health check
        run: docker image inspect clientglass-api:ci --format '{{.Config.Healthcheck.Test}}' | grep -q api/health
      # The check that would have caught a CMD that migrates through the wrong URL: boot the real
      # image against an empty database and wait for it to migrate itself and report healthy.
      - name: Boots against an empty database and becomes healthy
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            -e JWT_SECRET=ci-only-dummy-secret-0000000000000000000000 \
            -e FRONTEND_URL=http://localhost:5173 -e PORT=8080 \
            clientglass-api:ci
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  # Dynamic scan (DAST): OWASP ZAP's baseline scan against the running API on a throwaway database.
  # Passive checks only, no attack traffic. Report-only for now (fail_action false) so the first runs
  # can be triaged; make it blocking once the findings it reports are cleared or accepted.
  dast:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-dummy-secret-0000000000000000000000
      FRONTEND_URL: http://localhost:5173
      PORT: '8080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Start the API
        run: |
          node src/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = "200" ] && exit 0
            sleep 2
          done
          cat api.log
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: http://127.0.0.1:8080
          fail_action: false
          allow_issue_writing: false

  # Deploys only after every check above passed, and only for a push to master
  # (never for a PR). render.yaml sets `autoDeploy: false`, so this job is the
  # only thing that can ship — a red CI run can no longer reach production.
  #
  # Needs RENDER_DEPLOY_HOOK_URL (Render → motive-api → Settings → Deploy Hook)
  # as a secret of the `render-production` GitHub environment, restricted to
  # the master branch. The hook URL is a credential: keep it in GitHub secrets,
  # never in the repo. `permissions: {}` — the job only calls curl and needs no
  # access to this repository's contents or the GitHub API.
  deploy:
    needs: [secret-scan, build, docker-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions: {}
    environment: render-production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      # Smoke check only: Render keeps serving the previous version until the
      # new one is healthy, so a pass here means the service is up, not that
      # the new build has finished rolling out.
      - name: Smoke-check /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://motive-api-u7xg.onrender.com/api/health; then exit 0; fi
            sleep 20
          done
          echo "API did not become healthy in time" >&2
          exit 1
