version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Prisma 7 drops `url` in schema.prisma and breaks `prisma generate`;
    # migrate on purpose, not through an automated bump.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per week for routine patch/minor bumps instead of one per
      # package — the two upstream-unfixed vulns (express->qs, prisma->
      # deepmerge-ts, confirmed via `npm audit fix --force --dry-run` showing
      # no available patched version) will keep showing up here until
      # upstream ships a fix; that's expected, not something to auto-merge.
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["patch", "minor"]
  # Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps
  # the SHAs and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
