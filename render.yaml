# Render Blueprint — Motive API (Node + Express + Socket.io + Postgres/Prisma).
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick this repo.
# Fill DATABASE_URL (Neon), FRONTEND_URL, COOKIE_DOMAIN in the dashboard; the rest is preset.
services:
  - type: web
    name: motive-api
    runtime: node
    # Free plan: $0, but sleeps after ~15 min idle (first request after idle is
    # slow ~30-60s, and Socket.io connections drop). Switch to "starter" ($7/mo)
    # when you want it always-on for real-time + instant responses.
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app reads process.env.PORT.
      - key: JWT_SECRET
        generateValue: true # Render generates a strong 32+ char secret
      - key: DATABASE_URL
        sync: false # Neon Postgres pooled connection string (secret)
      - key: FRONTEND_URL
        sync: false # exact web origin, e.g. https://motive-web.onrender.com
      # Default .onrender.com URLs put web + API on different domains → the refresh
      # cookie must be cross-site (None + Secure). Switch to "lax" only once both
      # are on one registrable domain (app.x.com + api.x.com).
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      # Leave COOKIE_DOMAIN unset for cross-domain .onrender.com hosting.
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      # Stripe — start with TEST mode keys (sk_test_/whsec_) until checkout is verified end-to-end.
      - key: STRIPE_SECRET_KEY
        sync: false
      # From the webhook endpoint's "Signing secret" in the Stripe Dashboard
      # (Developers → Webhooks → add endpoint https://<this-service>/api/payments/webhook).
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRO_UPGRADE_PRICE_USD_CENTS
        value: "999"
      - key: PRO_UPGRADE_PRICE_INR_PAISE
        value: "79900"
      # Password reset email — get a key from https://resend.com/api-keys.
      # Without it, reset emails just no-op with a console warning.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Error tracking — get a DSN from https://sentry.io. Without it,
      # errors are only logged to stdout (Render's log retention is short).
      - key: SENTRY_DSN
        sync: false
      # Optional structured-log shipping to Better Stack (free tier: 1GB/mo,
      # 3-day retention) on top of stdout — see .env.example. Without it,
      # logs still go to stdout same as SENTRY_DSN's note above.
      - key: LOGTAIL_SOURCE_TOKEN
        sync: false
      # File storage (Cloudflare R2) — without these, uploads fall back to
      # local disk, which Render wipes on every deploy/restart. See
      # motive-backend/.env.example for how to create the bucket/token.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Google OAuth login — get credentials from
      # https://console.cloud.google.com/apis/credentials. Without them,
      # email/password auth works fine, "Continue with Google" just 400s.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match the Authorized redirect URI registered above,
      # e.g. https://motive-api-u7xg.onrender.com/api/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
